[target.x86_64-apple-darwin]
rustflags=["-C", "link-arg=-mmacosx-version-min=10.13"]

[target.aarch64-apple-darwin]
rustflags=["-C", "link-arg=-mmacosx-version-min=10.13"]

[target.x86_64-pc-windows-msvc]
linker = "/Users/ea/code/beb/DesktopUI/cross/bin/lld-link"
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-gnullvm]
linker = "/Users/ea/llvm-mingw/bin/aarch64-w64-mingw32-clang"
rustflags = [
    "-C", "link-arg=-fuse-ld=lld",
    "-C", "link-arg=-luuid",
    "-C", "link-arg=-Wl,-Bstatic",
    "-C", "link-arg=-lc++",
    "-C", "link-arg=-lc++abi",
    "-C", "link-arg=-lunwind",
    "-C", "link-arg=-Wl,-Bdynamic",
]

